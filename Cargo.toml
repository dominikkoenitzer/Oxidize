[package]
name = "oxidize"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Uninstall Windows programs and remove what they leave behind."
authors = ["dominikkoenitzer"]
publish = false
readme = "README.md"
repository = "https://github.com/dominikkoenitzer/Oxidize"
homepage = "https://github.com/dominikkoenitzer/Oxidize"
keywords = ["windows", "uninstall", "registry", "cleanup", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "oxidize"
path = "src/lib.rs"

[[bin]]
name = "oxidize"
path = "src/main.rs"

[[bin]]
name = "oxidize-gui"
path = "src/bin/oxidize-gui.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
winreg = "0.56"
sysinfo = "0.39"
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# glow instead of the wgpu default: it survives VMs and remote desktop.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
