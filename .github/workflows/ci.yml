name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On a timer as well as on every push. Nothing here changes between those
  # runs; what changes underneath it does. A new toolchain, a new runner
  # image, a yanked dependency. Any of those turns a green build red with no
  # commit, and without this nobody finds out until the next push.
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A second push to the default branch used to cancel the run for the first one, so that commit was never
  # checked by anything. Only a superseded pull request push is safe to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The download page serves site/skill/oxidize.zip as it is in the repo, so it has to hold
      # exactly the skill folder beside it.
      - name: Skill zip
        shell: pwsh
        run: ./scripts/skill-zip.ps1 -Rev HEAD -Check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --release --all-targets

      - name: Test
        run: cargo test --locked --workspace

      # On the runner TEMP is a short 8.3 path. On most machines it is the long path below
      # %LOCALAPPDATA%, and some move it to a folder of its own on the drive, so the tests run
      # with both of those as well. Not into the profile: the temp clean refuses a folder there.
      - name: Test with TEMP below LOCALAPPDATA
        shell: pwsh
        run: |
          $temp = Join-Path $env:LOCALAPPDATA "Temp"
          $env:TEMP = $temp
          $env:TMP = $temp
          cargo test --locked --lib
          exit $LASTEXITCODE

      - name: Test with TEMP on the drive
        shell: pwsh
        run: |
          $temp = Join-Path $env:SystemDrive "oxidize-temp"
          New-Item -ItemType Directory -Force $temp | Out-Null
          $env:TEMP = $temp
          $env:TMP = $temp
          cargo test --locked --lib
          $code = $LASTEXITCODE
          Remove-Item -Recurse -Force $temp
          exit $code

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: oxidize-windows
          path: |
            target/release/oxidize.exe
            target/release/oxidize-gui.exe
          if-no-files-found: error
