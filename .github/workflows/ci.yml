name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On a timer as well as on every push. Nothing here changes between those
  # runs; what changes underneath it does. A new toolchain, a new runner
  # image, a yanked dependency. Any of those turns a green build red with no
  # commit, and without this nobody finds out until the next push.
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A second push to the default branch used to cancel the run for the first one, so that commit was never
  # checked by anything. Only a superseded pull request push is safe to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The download page serves site/skill/oxidize.zip as it is in the repo, so it has to hold
      # exactly the skill folder beside it.
      - name: Skill zip
        shell: pwsh
        run: ./scripts/skill-zip.ps1 -Rev HEAD -Check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --release --all-targets

      # The built binary scans a made-up profile and has to report its two folders and nothing else.
      - name: Scan a fixture profile
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture'
          $env:APPDATA = Join-Path $fixture 'Roaming'
          $env:LOCALAPPDATA = Join-Path $fixture 'Local'
          $left = @((Join-Path $env:APPDATA 'Quillmark'), (Join-Path $env:LOCALAPPDATA 'Quillmark'))
          $kept = Join-Path $env:APPDATA 'Fernleaf'
          foreach ($dir in $left + $kept) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Set-Content -Path (Join-Path $dir 'settings.ini') -Value 'theme=dark'
          }
          $out = & ./target/release/oxidize.exe scan Quillmark --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "scan exited with $LASTEXITCODE" }
          $out
          $paths = @(($out | ConvertFrom-Json).items | ForEach-Object { $_.path })
          foreach ($dir in $left) { if ($paths -notcontains $dir) { throw "scan missed $dir" } }
          if ($paths -contains $kept) { throw "scan reported $kept" }
          foreach ($path in $paths) { if (-not $path.StartsWith($fixture)) { throw "scan reported $path" } }

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: oxidize-windows
          path: |
            target/release/oxidize.exe
            target/release/oxidize-gui.exe
          if-no-files-found: error
