name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  # Never cancel a publish in flight: a half-uploaded asset is worse than a
  # duplicate run.
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A tag push does not run CI, so everything CI would have said has to be
      # said here too. A release built from a commit that never saw clippy or
      # the test suite is a release nobody checked.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build
        run: cargo build --locked --release

      # The asset names carry no version, so the README can link to
      # releases/latest/download/<name> and the link never goes stale.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/oxidize.exe dist/
          Copy-Item target/release/oxidize-gui.exe dist/
          Compress-Archive -Path dist/oxidize.exe, dist/oxidize-gui.exe -DestinationPath dist/oxidize-windows-x64.zip
          foreach ($name in 'oxidize-gui.exe', 'oxidize.exe', 'oxidize-windows-x64.zip') {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            Set-Content "dist/$name.sha256" "$hash  $name"
          }

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/oxidize-gui.exe
            dist/oxidize-gui.exe.sha256
            dist/oxidize.exe
            dist/oxidize.exe.sha256
            dist/oxidize-windows-x64.zip
            dist/oxidize-windows-x64.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
